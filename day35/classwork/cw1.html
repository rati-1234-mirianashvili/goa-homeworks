<!DOCTYPE html>
<html>
<head>
<style>

table {
    border-collapse: collapse;
    width: 600px;
}

th {
    background-color: green;
    color: black;
}

th, td {
    border: 2px solid black;
    padding: 8px;
    text-align: center;
}

tr:nth-child(even) {
    background-color: #1da3b8;
}

</style>
</head>

<body>

<h1 style="text-align:center;">Employee Table</h1>

<table>

<tr>
    <th>EmpId</th>
    <th>EmpName</th>
    <th>EmpDept</th>
    <th>EmpSalary</th>
</tr>

<tr>
    <td>101</td>
    <td>Joe</td>
    <td>Development</td>
    <td>50000</td>
</tr>

<tr>
    <td>102</td>
    <td>Mary</td>
    <td>Testing</td>
    <td>30000</td>
</tr>

<tr>
    <td>103</td>
    <td>Beck</td>
    <td>Analyst</td>
    <td>40000</td>
</tr>

<tr>
    <td>104</td>
    <td>Candace</td>
    <td>Development</td>
    <td>45000</td>
</tr>

</table>

</body>
</html>
