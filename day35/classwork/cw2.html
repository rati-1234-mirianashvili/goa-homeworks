<!DOCTYPE html>
<html>
<head>

<style>

table {
    border-collapse: collapse;
    width: 700px;
}

th {
    background-color: lightgreen;
}

th, td {
    border: 1px solid brown;
    padding: 10px;
    text-align: center;
}

</style>

</head>

<body>

<h1 style="color:green; text-align:center;">
GeeksforGeeks
</h1>

<h3 style="color:green; text-align:center;">
The TH element defines table headers.
</h3>


<table>

    <th>Name</th>

    <th>Roll No</th>
</tr>

<tr>
    <td>Mahima</td>

</tr>

<tr>
    <td>Krishn</td>

</tr>

<tr>

</tr>

</table>


</body>
</html>
