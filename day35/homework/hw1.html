}

th, td {
    border: 2px solid #7aa51c;

</style>

</head>

<table>

</tr>

<tr>
    <td>Row2, Cell1</td>
    <td>Row2, Cell2</td>

</tr>

<tr>
    <td>Row3, Cell1</td>

</tr>

</table>

</body>
</html>
