<!DOCTYPE html>
<html>
<body>

<!-- text - ჩვეულებრივი ტექსტის შესაყვანი ველი -->
<input type="text">

<!-- password - პაროლის შესაყვანი ველი (დამალული ტექსტით) -->
<input type="password">

<!-- email - ელფოსტის შესაყვანი ველი -->
<input type="email">

<!-- number - მხოლოდ რიცხვის შესაყვანი ველი -->
<input type="number">

<!-- date - თარიღის ასარჩევი -->
<input type="date">

<!-- time - დროის ასარჩევი -->
<input type="time">

<!-- checkbox - რამდენიმე არჩევანის გაკეთება -->
<input type="checkbox">

<!-- radio - ერთი არჩევანის გაკეთება ჯგუფიდან -->
<input type="radio">

<!-- file - ფაილის ასატვირთი ღილაკი -->
<input type="file">

<!-- color - ფერის ასარჩევი -->
<input type="color">

<!-- range - მნიშვნელობის სლაიდერით არჩევა -->
<input type="range">

<!-- submit - ფორმის გაგზავნის ღილაკი -->
<input type="submit">

<!-- reset - ფორმის გასუფთავება -->
<input type="reset">

</body>
</html>
