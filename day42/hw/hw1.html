<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Flex Shrink</title>
    <style>
        .parent {
            display: flex;
            width: 500px;
            border: 2px solid black;
        }

        .box {
            width: 250px;
            height: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }

        .box1 {
            background-color: red;
            flex-shrink: 1;
        }

        .box2 {
            background-color: blue;
            flex-shrink: 0;
        }

        .box3 {
            background-color: green;
            flex-shrink: 2;
        }
    </style>
</head>
<body>

<div class="parent">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
</div>

</body>
</html>
