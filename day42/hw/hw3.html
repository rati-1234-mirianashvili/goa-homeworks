<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Order</title>
    <style>
        .parent {
            display: flex;
            gap: 10px;
        }

        .box {
            width: 60px;
            height: 60px;
            background-color: teal;
            color: white;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
        }

        .box1 {
            order: 4;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 6;
        }

        .box4 {
            order: 2;
        }

        .box5 {
            order: 5;
        }

        .box6 {
            order: 3;
        }
    </style>
</head>
<body>

<div class="parent">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
    <div class="box box6">6</div>
</div>

</body>
</html>
