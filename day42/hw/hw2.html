<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Align Self</title>
    <style>
        .parent {
            display: flex;
            height: 300px;
            border: 2px solid black;
        }

        .box {
            width: 70px;
            height: 70px;
            margin: 5px;
            background-color: orange;
            text-align: center;
            line-height: 70px;
            font-size: 20px;
        }

        .box1 {
            align-self: flex-start;
        }

        .box2 {
            align-self: flex-end;
        }

        .box3 {
            align-self: center;
        }

        .box4 {
            align-self: flex-start;
        }

        .box5 {
            align-self: flex-end;
        }
    </style>
</head>
<body>

<div class="parent">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
</div>

</body>
</html>
