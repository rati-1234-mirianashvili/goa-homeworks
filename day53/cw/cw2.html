<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Translate Example</title>
    <style>
        .box {
            width: 120px;
            height: 120px;
            background-color: coral;
            transition: transform 0.5s ease;
        }

        .box:hover {
            transform: translate(100px, -50px);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
