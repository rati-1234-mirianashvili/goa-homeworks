<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Transform Origin Example</title>
    <style>
        .box {
            width: 120px;
            height: 120px;
            margin: 50px;
            background-color: orange;
            transform-origin: bottom left;
            transition: transform 0.5s ease;
        }

        .box:hover {
            transform: scale(1.3) rotate(20deg);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
