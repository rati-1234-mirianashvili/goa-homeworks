<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 100px 100px;
            gap: 5px;
        }

        .box {
            border: 2px solid green;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box3 {
            grid-column: 3;
            grid-row: 1/3
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box box3">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
</body>
</html>
