<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>დავალება</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 17px 30px;
            font-family: Arial, sans-serif;
        }

        .row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .box {
            height: 44px;
            background: #ffd000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 23px;
        }

        /* 1 */
        .row1 .box {
            width: 100%;
        }

        /* 2 - 3 */
        .row2 .box {
            width: 50%;
        }

        /* 4 - 6 */
        .row3 .box {
            width: 33.333%;
        }

        /* 7 - 10 */
        .row4 .box {
            width: 25%;
        }

        /* 11 - 16 */
        .row5 .box {
            width: 16.666%;
        }

        /* 17 - 28 */
        .row6 .box {
            width: 8.333%;
        }
    </style>
</head>

<body>

    <div class="row row1">
        <div class="box">1</div>
    </div>

    <div class="row row2">
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <div class="row row3">
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

    <div class="row row4">
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>

    <div class="row row5">
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
        <div class="box">14</div>
        <div class="box">15</div>
        <div class="box">16</div>
    </div>

    <div class="row row6">
        <div class="box">17</div>
        <div class="box">18</div>
        <div class="box">19</div>
        <div class="box">20</div>
        <div class="box">21</div>
        <div class="box">22</div>
        <div class="box">23</div>
        <div class="box">24</div>
        <div class="box">25</div>
        <div class="box">26</div>
        <div class="box">27</div>
        <div class="box">28</div>
    </div>

</body>
</html>
